<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aperçu — maison de Mnémosia</title>
<style>
  body {
    margin:0; padding:30px 16px; font-family:'Trebuchet MS', 'Segoe UI', sans-serif;
    background:#F4F6F9; color:#1F3864;
  }
  h1 { font-size:20px; text-align:center; margin:0 0 6px; }
  p.note { text-align:center; font-size:13px; color:#5A6B8C; margin:0 0 26px; }

  /* le sol de sable, comme dans la scene du village */
  .scene {
    max-width:900px; margin:0 auto 26px; border-radius:18px; padding:36px 20px 40px;
    background:linear-gradient(to bottom, #E8D4A6 0%, #DCC38C 26%, #CBAE72 58%, #B7975C 100%);
    border:2px solid #0E1626;
    box-shadow:inset 2px 2px 0 rgba(255,255,255,0.22), inset -2px -2px 0 rgba(0,0,0,0.35),
               0 10px 22px -6px rgba(0,0,0,0.5);
    display:flex; gap:32px; justify-content:center; align-items:flex-end; flex-wrap:wrap;
  }
  .demeure { position:relative; }
  .demeure svg.maison { display:block; filter:drop-shadow(4px 5px 5px rgba(58,40,16,0.42)); }
  .taille-1 svg.maison { width:110px; }
  .taille-2 svg.maison { width:170px; }
  .taille-3 svg.maison { width:240px; }
  .etiquette { text-align:center; font-size:12px; font-weight:700; color:#4A3A1E; margin-top:8px; }

  /* l'habitant a sa fenetre */
  .fenetre-perso {
    position:absolute; left:18.5%; top:60.5%; width:12.5%; height:15%;
    border-radius:3px; overflow:hidden;
  }
  .fenetre-perso svg { width:100%; height:100%; display:block; }

  .fond-sombre { background:#B7975C; }
  .bloc { max-width:900px; margin:0 auto 20px; }
  .bloc h2 { font-size:15px; margin:0 0 10px; }
</style>
</head>

<h1>Aperçu — la maison de Mnémosia</h1>
<p class="note">Ouvrez ce fichier dans votre navigateur : aucun dépôt nécessaire.</p>

<defs>

    <linearGradient id="murLateral" x1="0%" y1="0%" x2="100%" y2="6%">

      <stop offset="100%" stop-color="#6E5834" stop-opacity="0.60"/>

    <filter id="grainPierre" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="1.2" numOctaves="5" seed="13" result="bruit"/>
      <feColorMatrix in="bruit" type="saturate" values="0" result="bruitGris"/>
      <feComponentTransfer in="bruitGris" result="bruitDoux">
        <feFuncA type="linear" slope="0.28"/>
      </feComponentTransfer>
      <feComposite in="bruitDoux" in2="SourceGraphic" operator="in" result="grainMasque"/>
      <feBlend in="SourceGraphic" in2="grainMasque" mode="multiply"/>
    </filter>

      <stop offset="100%" stop-color="#3A2810" stop-opacity="0"/>
